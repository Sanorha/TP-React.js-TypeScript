<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f2b"/>
      <stop offset="55%" stop-color="#171235"/>
      <stop offset="100%" stop-color="#2a1a3c"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffe9b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1c26"/>
      <stop offset="100%" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#ffb84d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb84d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neonPink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff3ea5"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1920" height="1080" fill="url(#sky)"/>

  <circle cx="1550" cy="160" r="220" fill="url(#moonGlow)"/>
  <circle cx="1550" cy="160" r="70" fill="#fff3d6"/>

  <g fill="#fdf6e3" opacity="0.8">
    <circle cx="120" cy="90" r="2"/>
    <circle cx="260" cy="150" r="1.6"/>
    <circle cx="400" cy="70" r="2.2"/>
    <circle cx="600" cy="120" r="1.5"/>
    <circle cx="780" cy="60" r="2"/>
    <circle cx="980" cy="140" r="1.8"/>
    <circle cx="1150" cy="90" r="2"/>
    <circle cx="1300" cy="50" r="1.5"/>
    <circle cx="1800" cy="120" r="2"/>
    <circle cx="1700" cy="220" r="1.6"/>
  </g>

  <!-- distant skyline -->
  <g fill="#120d29">
    <rect x="0" y="430" width="140" height="330"/>
    <rect x="150" y="380" width="110" height="380"/>
    <rect x="270" y="460" width="160" height="300"/>
    <rect x="440" y="400" width="90" height="360"/>
    <rect x="1350" y="410" width="120" height="350"/>
    <rect x="1480" y="460" width="150" height="300"/>
    <rect x="1640" y="390" width="100" height="370"/>
    <rect x="1760" y="440" width="160" height="320"/>
  </g>

  <!-- foreground buildings forming the street canyon -->
  <g fill="#08060f">
    <path d="M0,780 L0,340 L360,300 L520,420 L520,780 Z"/>
    <path d="M1920,780 L1920,320 L1560,280 L1400,420 L1400,780 Z"/>
  </g>

  <!-- lit windows left building -->
  <g fill="#ffd27a" opacity="0.85">
    <rect x="60" y="420" width="20" height="26"/>
    <rect x="110" y="420" width="20" height="26"/>
    <rect x="60" y="470" width="20" height="26"/>
    <rect x="160" y="470" width="20" height="26"/>
    <rect x="220" y="440" width="20" height="26"/>
    <rect x="270" y="500" width="20" height="26"/>
    <rect x="330" y="440" width="20" height="26"/>
    <rect x="380" y="500" width="20" height="26"/>
    <rect x="60" y="560" width="20" height="26"/>
    <rect x="160" y="560" width="20" height="26"/>
    <rect x="270" y="580" width="20" height="26"/>
  </g>

  <!-- lit windows right building -->
  <g fill="#ffd27a" opacity="0.85">
    <rect x="1440" y="460" width="20" height="26"/>
    <rect x="1500" y="460" width="20" height="26"/>
    <rect x="1560" y="420" width="20" height="26"/>
    <rect x="1620" y="420" width="20" height="26"/>
    <rect x="1680" y="470" width="20" height="26"/>
    <rect x="1740" y="440" width="20" height="26"/>
    <rect x="1800" y="500" width="20" height="26"/>
    <rect x="1440" y="560" width="20" height="26"/>
    <rect x="1740" y="560" width="20" height="26"/>
    <rect x="1800" y="580" width="20" height="26"/>
  </g>

  <!-- cinema marquee, small nod to a film catalogue theme -->
  <g>
    <rect x="1440" y="560" width="220" height="60" rx="4" fill="#1a0f24" stroke="url(#neonPink)" stroke-width="3"/>
    <text x="1550" y="600" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#ff3ea5" letter-spacing="4">CINEMA</text>
  </g>

  <!-- street lamps -->
  <g>
    <circle cx="440" cy="700" r="140" fill="url(#lampGlow)"/>
    <rect x="432" y="700" width="8" height="200" fill="#0a0a0c"/>
    <circle cx="436" cy="695" r="10" fill="#ffe9b3"/>

    <circle cx="1480" cy="720" r="140" fill="url(#lampGlow)"/>
    <rect x="1472" y="720" width="8" height="200" fill="#0a0a0c"/>
    <circle cx="1476" cy="715" r="10" fill="#ffe9b3"/>
  </g>

  <!-- the street -->
  <path d="M520,780 L960,470 L1400,780 Z" fill="url(#road)"/>
  <path d="M520,780 L960,470 L1400,780 Z" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="2"/>

  <!-- sidewalks -->
  <path d="M300,1080 L520,780 L560,780 L400,1080 Z" fill="#232330"/>
  <path d="M1620,1080 L1400,780 L1360,780 L1520,1080 Z" fill="#232330"/>

  <!-- lane markings -->
  <g stroke="#e8e2c9" stroke-opacity="0.75" stroke-width="8">
    <line x1="900" y1="900" x2="930" y2="820"/>
    <line x1="1020" y1="900" x2="990" y2="820"/>
    <line x1="820" y1="1020" x2="870" y2="900"/>
    <line x1="1100" y1="1020" x2="1050" y2="900"/>
  </g>

  <!-- reflective glow puddle -->
  <ellipse cx="960" cy="960" rx="260" ry="40" fill="#ff3ea5" opacity="0.08"/>
  <ellipse cx="960" cy="960" rx="180" ry="26" fill="#ffb84d" opacity="0.08"/>
</svg>
